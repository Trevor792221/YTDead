# TV version (the "tv" branch). Builds the APKs (arm32 for 32-bit Android, which most Android
# TV devices run, and arm64 for newer TVs) on every push. A push with a version that has no
# release yet (versionName in app/build.gradle) publishes GitHub Release tv-v<version> with the
# signed APKs attached; so does pushing a tag like tv-v3.2. The phone version lives on main.
#
# Signing uses these repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    the release keystore, base64-encoded (base64 -w0 release.jks)
#   KEYSTORE_PASSWORD  its store password
#   KEY_ALIAS          the key alias
#   KEY_PASSWORD       the key password
# Without them, builds are signed with a throwaway debug key and no release is published.
name: Build TV APK

on:
  push:
    branches: [tv]
    tags: ["tv-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "YTDEAD_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          YTDEAD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          YTDEAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          YTDEAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APKs
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle)
          cp app/build/outputs/apk/arm64/release/app-arm64-release.apk "YTDead-TV-$version-arm64.apk"
          cp app/build/outputs/apk/arm32/release/app-arm32-release.apk "YTDead-TV-$version-arm32.apk"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: YTDead-TV-${{ env.VERSION }}
          path: YTDead-TV-*.apk

      - name: Check for a release of this version
        id: release
        if: >-
          github.event_name == 'push' && env.YTDEAD_KEYSTORE != '' &&
          (github.ref == 'refs/heads/tv' || startsWith(github.ref, 'refs/tags/tv-v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "tv-v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.release.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: YTDead TV ${{ env.VERSION }}
          files: YTDead-TV-*.apk
          # Not "latest": the README's download button on main gets the phone APK from there.
          make_latest: false
          generate_release_notes: true

      # The README's TV download buttons link to the "tv-latest" release, which always holds
      # the newest TV APKs under fixed names.
      - name: Update the tv-latest download
        if: steps.release.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "YTDead-TV-$VERSION-arm32.apk" YTDead-TV-arm32.apk
          cp "YTDead-TV-$VERSION-arm64.apk" YTDead-TV-arm64.apk
          if ! gh release view tv-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create tv-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --latest=false --title "YTDead TV (newest)" \
              --notes "Always the newest YTDead TV version. arm32 works on most Android TVs; arm64 is for newer 64-bit TVs."
          fi
          gh release upload tv-latest YTDead-TV-arm32.apk YTDead-TV-arm64.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit tv-latest --repo "$GITHUB_REPOSITORY" --title "YTDead TV $VERSION (newest)" --latest=false
