# Builds the APK on every push and pull request. A push to main with a version that has no
# release yet (versionName in app/build.gradle) publishes a GitHub Release v<version> with the
# signed APK attached; so does pushing a tag like v2.1.
#
# Signing uses these repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    the release keystore, base64-encoded (base64 -w0 release.jks)
#   KEYSTORE_PASSWORD  its store password
#   KEY_ALIAS          the key alias
#   KEY_PASSWORD       the key password
# Without them, builds are signed with a throwaway debug key and no release is published.
name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "YTDEAD_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          YTDEAD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          YTDEAD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          YTDEAD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk "YTDead-$version.apk"
          echo "APK=YTDead-$version.apk" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # Same APK under a fixed name, for the README's download button
          # (releases/latest/download/YTDead.apk).
          cp "YTDead-$version.apk" YTDead.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      - name: Check for a release of this version
        id: release
        if: >-
          github.event_name == 'push' && env.YTDEAD_KEYSTORE != '' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.release.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: YTDead ${{ env.VERSION }}
          files: |
            ${{ env.APK }}
            YTDead.apk
          make_latest: true
          generate_release_notes: true
