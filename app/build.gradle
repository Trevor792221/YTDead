plugins {
    id("com.android.application")
}

android {
    namespace = "local.youtube.gecko"
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId = "local.youtube.gecko"
        minSdk = 26
        targetSdk = 36
        versionCode = 29
        versionName = "2.22"
    }

    // The release key is never committed. It comes from keystore.properties (local builds)
    // or YTDEAD_KEYSTORE* environment variables (CI). Without one, release builds use the
    // debug key, which can't update an installed copy signed with the release key.
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file("keystore.properties")
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    def keystorePath = keystoreProps.getProperty("storeFile") ?: System.getenv("YTDEAD_KEYSTORE")

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile = rootProject.file(keystorePath)
                storePassword = keystoreProps.getProperty("storePassword") ?: System.getenv("YTDEAD_KEYSTORE_PASSWORD")
                keyAlias = keystoreProps.getProperty("keyAlias") ?: System.getenv("YTDEAD_KEY_ALIAS")
                keyPassword = keystoreProps.getProperty("keyPassword") ?: System.getenv("YTDEAD_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation("org.mozilla.geckoview:geckoview-arm64-v8a:159.0.20261022150525")
    implementation("androidx.credentials:credentials:1.6.0")
    implementation("androidx.credentials:credentials-play-services-auth:1.6.0")
}
